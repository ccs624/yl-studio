<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Studio | 鋼琴譜客製化</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F9F7F2; /* 米白色背景 */
            --primary-color: #1A1A1A;
            --accent-color: #666;
            --transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 60px 24px;
            text-align: center;
        }

        /* 橫式 Logo 優化 */
        .logo-area {
            margin: 40px 0 50px 0;
            display: flex;
            justify-content: center;
        }
        .logo-area img {
            width: 320px; /* 橫式 Logo 寬度 */
            max-width: 85%;
            height: auto;
            mix-blend-mode: multiply; /* 讓 Logo 與米色背景融合 */
            filter: grayscale(1); /* 確保顏色純粹 */
        }

        h1, h2, h3 { font-family: 'Noto Serif TC', serif; letter-spacing: 3px; }

        .fade-in { opacity: 0; transform: translateY(20px); transition: var(--transition); }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* 服務項目 */
        .services {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            text-align: left;
            margin: 60px 0;
        }
        .service-item h3 { font-size: 1.1rem; border-bottom: 1px solid #ddd; padding-bottom: 10px; }

        /* 訂購流程與價格 */
        .order-section {
            background-color: #FFF;
            padding: 45px 35px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            text-align: left;
            margin: 40px 0;
            border: 1px solid rgba(0,0,0,0.03);
        }

        .price-tag {
            background: #fdfaf5;
            border: 1px dashed var(--primary-color);
            padding: 15px;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1rem;
            font-family: 'Noto Serif TC', serif;
        }

        .order-step { display: flex; align-items: flex-start; margin-bottom: 20px; }
        .step-num {
            background: var(--primary-color);
            color: #FFF;
            width: 24px; height: 24px;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; margin-right: 15px; flex-shrink: 0;
            margin-top: 5px;
        }

        /* 按鈕設計 */
        .cta-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 40px;
        }
        .cta-button {
            text-decoration: none;
            padding: 18px 0;
            letter-spacing: 2px;
            transition: var(--transition);
            font-weight: 500;
            flex: 1;
            max-width: 220px;
            text-align: center;
            font-size: 0.95rem;
        }
        .cta-button.primary { background: var(--primary-color); color: #fff; border: 1px solid var(--primary-color); }
        .cta-button.secondary { background: transparent; color: var(--primary-color); border: 1px solid var(--primary-color); }
        
        .cta-button:hover { opacity: 0.7; transform: translateY(-2px); }

        footer { margin-top: 100px; font-size: 0.75rem; opacity: 0.4; padding-bottom: 40px; }

        @media (max-width: 600px) {
            .services { grid-template-columns: 1fr; }
            .cta-group { flex-direction: column; align-items: center; }
            .cta-button { width: 100%; max-width: none; }
        }
    </style>
</head>
<body>

<div class="container">
    <header class="fade-in">
        <div class="logo-area">
            <img src="logo.svg" alt="YL Studio Logo">
        </div>
        <p style="letter-spacing: 2px; color: var(--accent-color);">讓每一段旋律，以最適合你的姿態躍然紙上</p>
    </header>

    <main>
        <section class="services fade-in">
            <div class="service-item">
                <h3>專業客製編譜</h3>
                <p>依程度調整難度，可指定調性，提供清楚易讀的鋼琴五線譜</p>
            </div>
            <div class="service-item">
                <h3>全方位曲風</h3>
                <p>流行歌曲、獨立樂團、伴奏譜皆可承接</p>
            </div>
        </section>

        <section class="order-section fade-in">
            <h2 style="text-align: center; margin-bottom: 10px;">訂購與費用</h2>
            
            <div class="price-tag">
                <strong>五分鐘內曲目：一律 NT$ 149</strong>
                <div style="font-size: 0.8rem; margin-top: 5px; color: #888;">(超過五分鐘之曲目請私訊詳談報價)</div>
            </div>
            
            <div class="order-step">
                <div class="step-num">1</div>
                <div>
                    <strong>加入 Line 私訊聯繫</strong>
                    <p style="margin: 5px 0;">告知歌曲名稱與具體需求</p>
	      </div>
            </div>
            <div class="order-step">
                <div class="step-num">2</div>
                <div>
                    <strong>確認資訊與下單</strong>
                    <p style="margin: 5px 0;">雙方確認價格與曲目細節後，前往賣貨便賣場下單完成預訂</p>
     </div>
            </div>
            <div class="order-step">
                <div class="step-num">3</div>
                <div>                    <strong>音檔確認與交付</strong>
                    <p style="margin: 5px 0;">製作完成提供音檔確認後，寄出紙本樂譜</p>
                </div>
            </div>
        </section>

        <div class="cta-group fade-in">
            <a href="https://lin.ee/GYNtwsD" class="cta-button primary">Line 私訊諮詢</a>
            <a href="https://myship.7-11.com.tw/general/detail/GM2602043384846" class="cta-button secondary">賣貨便下單區</a>
        </div>
    </main>

    <footer class="fade-in">
        <p>© 2025 YL STUDIO. ESTD 2025</p>
    </footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });
        document.querySelectorAll('.fade-in').forEach((el) => observer.observe(el));
    });
</script>

</body>
</html>
