<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YL Studio | 鋼琴譜客製化</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f2e9dc; 
            --primary-color: #1a1a1a;
            --accent-color: #555;
            --transition: all 0.5s cubic-bezier(0.165, 0.84, 0.44, 1);
        }

        body, html {
            margin: 0; padding: 0;
            background-color: var(--bg-color);
            color: var(--primary-color);
            font-family: 'Noto Sans TC', sans-serif;
            line-height: 1.8;
            scroll-behavior: smooth;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 60px 20px;
            text-align: center;
        }

        /* SVG Logo 容器優化 */
        .logo-area {
            margin-bottom: 40px;
        }
        .logo-area img {
            width: 220px; /* SVG 可以自由調整大小而不失真 */
            height: auto;
            transition: var(--transition);
        }

        h1, h2, h3 { font-family: 'Noto Serif TC', serif; letter-spacing: 2px; }

        .fade-in { opacity: 0; transform: translateY(20px); transition: var(--transition); }
        .fade-in.visible { opacity: 1; transform: translateY(0); }

        /* 服務項目更新 */
        .services {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            text-align: left;
            margin: 60px 0;
        }

        .service-item {
            border-left: 1px solid var(--primary-color);
            padding-left: 20px;
        }

        .info-section {
            background: rgba(255, 255, 255, 0.2);
            padding: 40px;
            border-radius: 4px;
            margin: 40px 0;
            border: 1px solid rgba(26, 26, 26, 0.05);
        }

        .cta-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: #fff;
            padding: 18px 50px;
            text-decoration: none;
            letter-spacing: 2px;
            transition: var(--transition);
            border: 1px solid var(--primary-color);
            margin-top: 20px;
        }

        .cta-button:hover {
            background-color: transparent;
            color: var(--primary-color);
            transform: scale(1.05);
        }

        footer { margin-top: 100px; font-size: 0.8rem; opacity: 0.6; padding-bottom: 40px; }

        @media (max-width: 600px) { .services { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <header class="fade-in">
        <div class="logo-area">
            <img src="logo.svg" alt="YL Studio Logo">
        </div>
        <p style="font-size: 1.1rem; letter-spacing: 1px; color: var(--accent-color);">讓每一段旋律，以最適合你的姿態躍然紙上。</p>
    </header>

    <main>
        <section class="services fade-in">
            <div class="service-item">
                <h3>專業客製編譜</h3>
                <p>依據程度量身打造，不論是初學者、進階練習或表演需求，皆能提供清楚易讀的五線譜。</p>
            </div>
            <div class="service-item">
                <h3>全方位曲風</h3>
                <p>流行歌曲、獨立樂團、純鋼琴譜或鋼琴伴奏譜皆可承接。</p>
            </div>
        </section>

        <section class="info-section fade-in">
            <h3>服務細節</h3>
            <p><strong>標準定價：</strong>歌曲長度 5 分鐘內 一律 $149</p>
            <p><strong>交付內容：</strong>依需求調整難度 / 指定調性 / 紙本檔案交付</p>
            <p style="font-size: 0.85rem; margin-top: 15px;">※ 超過 5 分鐘另行評估。客製化商品完成後恕不退換。</p>
        </section>

        <a href="https://myship.7-11.com.tw/general/detail/GM2602043384846" class="cta-button fade-in">進入賣場訂製</a>
    </main>

    <footer class="fade-in">
        <p>© 2025 YL Studio. ESTD 2025</p>
    </footer>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) entry.target.classList.add('visible');
            });
        }, { threshold: 0.1 });

        document.querySelectorAll('.fade-in').forEach((el) => observer.observe(el));
    });
</script>

</body>
</html>
